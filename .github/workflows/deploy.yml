name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build
      run: npm run build

    # Vite xóa dist/ khi build; public/ không có trên CI (.gitignore).
    # Khôi phục data/assets/icons đã commit trong dist/ — không ghi đè bundle JS mới.
    - name: Restore static files into dist after build
      run: |
        restore_if_tracked() {
          for path in "$@"; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git checkout HEAD -- "$path"
              echo "restored: $path"
            fi
          done
        }
        restore_if_tracked \
          dist/data \
          dist/favicon.ico \
          dist/icon-192.webp \
          dist/background.html \
          dist/payment-return.html \
          dist/verify-email.html \
          dist/mailBg.webp
        restore_if_tracked dist/assets/images dist/assets/sounds
        restore_if_tracked dist/assets/desktop dist/assets/mobile

    - name: Verify dist has required static files
      run: |
        test -f dist/data/theme.json || (echo "Missing dist/data/theme.json" && exit 1)
        test -f dist/icon-192.webp || (echo "Missing dist/icon-192.webp" && exit 1)
        echo "dist/data and PWA icons OK"
      
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
