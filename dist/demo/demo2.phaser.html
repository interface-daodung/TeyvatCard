<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Phaser Holo Card – Sharp</title>
<style>
  body { margin: 0; background: #101014; }
</style>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
<script>

const CARD_W = 420/2;
const CARD_H = 720/2;
const PAD    = 140;
const QUAD_W = CARD_W + PAD * 2;  // 700
const QUAD_H = CARD_H + PAD * 2;  // 1000

class HoloPipeline extends Phaser.Renderer.WebGL.Pipelines.SinglePipeline {
  constructor(game) {
    super({
      game,
      renderer: game.renderer,
      fragShader: `
        precision mediump float;

        uniform sampler2D uMainSampler;
        uniform float uTime;
        uniform vec2  uMouse;
        uniform float uRotX;
        uniform float uRotY;
        uniform vec2  uCardSize;
        uniform vec2  uQuadSize;

        varying vec2 outTexCoord;

        float rand(vec2 co) {
          return fract(sin(dot(co, vec2(12.9898, 78.233))) * 43758.5453);
        }
        vec3 rainbow(float t) {
          return vec3(
            sin(t)         * 0.5 + 0.5,
            sin(t + 2.094) * 0.5 + 0.5,
            sin(t + 4.188) * 0.5 + 0.5
          );
        }
        float edgeMask(vec2 uv, vec2 res) {
          vec2 px = uv * res;
          vec2 d  = min(px, res - px);
          return smoothstep(0.0, 1.5, min(d.x, d.y));
        }

        void main() {
          /* quad UV → pixel position inside quad */
          vec2 posPx = outTexCoord * uQuadSize;

          /* padding so card sits centred in quad */
          vec2 pad        = (uQuadSize - uCardSize) * 0.5;
          vec2 cardCentre = pad + uCardSize * 0.5;

          /* position relative to card centre, normalised */
          float aspect = uCardSize.x / uCardSize.y;
          float fov    = 1.8;
          float px = ((posPx.x - cardCentre.x) / (uCardSize.x * 0.5)) * aspect;
          float py =  (posPx.y - cardCentre.y) / (uCardSize.y * 0.5);
          float pz = 0.0;

          /* rotateY */
          float cy = cos(uRotY); float sy = sin(uRotY);
          float rx = px * cy - pz * sy;
          float rz = px * sy + pz * cy;

          /* rotateX */
          float cx = cos(uRotX); float sx = sin(uRotX);
          float ry = py * cx - rz * sx;
          float rz2 = py * sx + rz * cx;

          /* perspective divide */
          float sc = fov / (fov + rz2);
          float wx = (rx * sc) / aspect;
          float wy =  ry * sc;

          /* back to card UV [0,1] */
          vec2 wuv = vec2(wx * 0.5 + 0.5, wy * 0.5 + 0.5);

          /* discard outside card */
          if (wuv.x < 0.0 || wuv.x > 1.0 ||
              wuv.y < 0.0 || wuv.y > 1.0) {
            gl_FragColor = vec4(0.0);
            return;
          }

          /* --- KEY FIX ---
             uMainSampler is the RenderTexture (QUAD_W x QUAD_H).
             The card image was drawn onto it at pixel offset (PAD, PAD)
             so we remap wuv (card space) → RT UV space.              */
          vec2 rtUV = (vec2(pad.x, pad.y) + wuv * uCardSize) / uQuadSize;
          vec4 base = texture2D(uMainSampler, rtUV);

          float mask = edgeMask(wuv, uCardSize);

          /* holographic */
          vec2  huv     = wuv + rand(wuv + uTime) * 0.008;
          vec3  spectrum = rainbow(uTime + huv.x * 10.0 + huv.y * 4.0);
          float sparkle  = step(0.997, rand(huv * 500.0 + uTime));
          vec2  light    = uMouse - wuv;
          float dist     = length(light);
          float spec     = pow(max(1.0 - dist, 0.0), 6.0);
          vec3  holo     = spectrum * spec * 0.9 + sparkle * 1.2;

          vec3  color = base.rgb + holo * base.a;
          float alpha = base.a * mask;

          gl_FragColor = vec4(color * alpha, alpha);
        }
      `
    });
  }
}

class SceneMain extends Phaser.Scene {

  preload() {
    this.load.image('card',
      'https://raw.githubusercontent.com/interface-daodung/TeyvatCardGameBackend/refs/heads/main/admin-web/public/assets/images/cards/character/nahida.webp'
    );
  }

  create() {
    const W = this.scale.width;
    const H = this.scale.height;

    /* --- RenderTexture: QUAD_W x QUAD_H, card drawn at 1:1 in centre --- */
    const rt = this.add.renderTexture(0, 0, QUAD_W, QUAD_H);

    /* draw card at native resolution (420x720), centred inside padding */
    const tempImg = this.add.image(PAD + CARD_W / 2, PAD + CARD_H / 2, 'card');
    tempImg.setDisplaySize(CARD_W, CARD_H);
    rt.draw(tempImg, PAD + CARD_W / 2, PAD + CARD_H / 2);
    tempImg.destroy();

    /* save as texture so our pipeline can sample it */
    rt.saveTexture('cardRT');
    rt.destroy();

    /* register pipeline */
    this.renderer.pipelines.add('Holo', new HoloPipeline(this.game));

    /* display image using the RT texture, sized to QUAD_W x QUAD_H
       — no stretching: RT pixels map 1:1 to display pixels          */
    this.displayCard = this.add.image(W / 2, H / 2, 'cardRT');
    this.displayCard.setDisplaySize(QUAD_W, QUAD_H);
    this.displayCard.setPipeline('Holo');

    const p = this.renderer.pipelines.get('Holo');
    p.set2f('uCardSize', CARD_W, CARD_H);
    p.set2f('uQuadSize', QUAD_W, QUAD_H);

    this._mouse    = { x: 0.5, y: 0.5 };
    this._targetRX = 0;
    this._targetRY = 0;
    this._rotX     = 0;
    this._rotY     = 0;

    const MAX = Phaser.Math.DegToRad(22);

    this.input.on('pointermove', pointer => {
      const nx = pointer.x / W - 0.5;
      const ny = pointer.y / H - 0.5;
      this._targetRX = -ny * MAX * 2;
      this._targetRY =  nx * MAX * 2;
      this._mouse.x  = nx + 0.5;
      this._mouse.y  = 1.0 - (ny + 0.5);
    });

    const reset = () => { this._targetRX = 0; this._targetRY = 0; };
    this.input.on('pointerout', reset);
    this.input.on('gameout',    reset);
  }

  update(time) {
    this._rotX += (this._targetRX - this._rotX) * 0.10;
    this._rotY += (this._targetRY - this._rotY) * 0.10;

    const p = this.renderer.pipelines.get('Holo');
    p.set1f('uRotX',  this._rotX);
    p.set1f('uRotY',  this._rotY);
    p.set1f('uTime',  time * 0.002);
    p.set2f('uMouse', this._mouse.x, this._mouse.y);
  }
}

new Phaser.Game({
  type:            Phaser.WEBGL,
  width:           window.innerWidth,
  height:          window.innerHeight,
  backgroundColor: '#101014',
  scene:           [SceneMain],
});

</script>
</body>
</html>
