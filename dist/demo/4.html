<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Card + Separate Glow</title>

<style>
body{
 margin:0;
 background:#050507;
 display:flex;
 justify-content:center;
 align-items:center;
 height:100vh;
 overflow:hidden;
}
</style>

</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<script>

const TARGET_W = 120;
const TARGET_H = 205;
const PADDING = 80;

class RainbowGlowPipeline extends Phaser.Renderer.WebGL.Pipelines.SinglePipeline {

constructor(game){
super({
game,
renderer:game.renderer,

fragShader:`

precision mediump float;

uniform sampler2D uMainSampler;
uniform float uTime;

varying vec2 outTexCoord;

vec3 rainbow(float t){
 return vec3(
  sin(t)*0.5+0.5,
  sin(t+2.094)*0.5+0.5,
  sin(t+4.188)*0.5+0.5
 );
}

float sdRoundRect(vec2 p, vec2 b, float r){
 vec2 d = abs(p) - b + vec2(r);
 return min(max(d.x,d.y),0.0) + length(max(d,0.0)) - r;
}

void main(){

 vec2 uv = outTexCoord;
 vec2 p = uv - 0.5;

 vec2 b = vec2(0.3,0.4);
 float radius = 0.05;

 float dist = sdRoundRect(p,b,radius);

 vec4 base = texture2D(uMainSampler,uv);

 float cardMask = smoothstep(0.005,0.0,dist);

 float glowMask = smoothstep(0.2,-0.05,dist);

 vec3 glowColor = rainbow(uTime*1.5 - dist*3.0);

 vec3 finalColor = mix(glowColor*glowMask*0.8, base.rgb, cardMask);

 float finalAlpha = max(cardMask*base.a, glowMask*0.5);

 gl_FragColor = vec4(finalColor*finalAlpha, finalAlpha);
}

`
});
}

}

class SceneMain extends Phaser.Scene{

preload(){

this.load.image(
'card_img',
'https://raw.githubusercontent.com/interface-daodung/TeyvatCardGameBackend/refs/heads/main/admin-web/public/assets/images/cards/character/nahida.webp'
);

}

create(){

const {width:W,height:H} = this.scale;

this.renderer.pipelines.add('GlowPipe', new RainbowGlowPipeline(this.game));

/* ===== ROOT CONTAINER ===== */

this.rootContainer = this.add.container(W/2, H/2);


/* ===== GLOW CONTAINER ===== */

const glowContainer = this.add.container(0,0);

const rtW = TARGET_W + PADDING;
const rtH = TARGET_H + PADDING;

const glowRT = this.add.renderTexture(0,0,rtW,rtH);

const frame = this.textures.getFrame('card_img');

const scaleX = TARGET_W / frame.width;
const scaleY = TARGET_H / frame.height;

const tempImage = this.make.image({key:'card_img'}, false);

tempImage.setScale(scaleX, scaleY);

glowRT.draw(tempImage, rtW/2, rtH/2);

tempImage.destroy();

glowRT.setPipeline('GlowPipe');

glowContainer.add(glowRT);


/* ===== CARD CONTAINER ===== */

const cardContainer = this.add.container(0,0);

const card = this.add.image(0,0,'card_img');

card.setDisplaySize(TARGET_W, TARGET_H);

cardContainer.add(card);


/* ===== ADD TO ROOT ===== */

this.rootContainer.add(glowContainer);
this.rootContainer.add(cardContainer);


/* ===== store refs ===== */

this.glowRT = glowRT;
this.glowContainer = glowContainer;
this.cardContainer = cardContainer;

}

update(time){

const p = this.renderer.pipelines.get('GlowPipe');

if(p) p.set1f('uTime', time*0.001);

}

}

new Phaser.Game({

type:Phaser.WEBGL,
width:window.innerWidth,
height:window.innerHeight,
backgroundColor:"#050507",
scene:[SceneMain]

});

</script>

</body>
</html>
