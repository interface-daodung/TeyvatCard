<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Card Demo</title>
    <style>
        :root {
            --color1: #00e2ff;
            --color2: #ff00e1;
            /* Hiệu ứng cầu vồng đặc trưng của thẻ bài */
            --holo-gradient: linear-gradient(125deg, 
                rgba(255,0,132,0.3) 15%, 
                rgba(252,255,0,0.3) 30%, 
                rgba(0,255,138,0.3) 45%, 
                rgba(0,209,255,0.3) 60%, 
                rgba(122,0,255,0.3) 85%);
        }

        body {
            background: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }

        /* Container để xử lý hiệu ứng 3D */
        .card-container {
            perspective: 1000px;
        }

        .card {
            width: 320px;
            height: 450px;
            border-radius: 18px;
            position: relative;
            background-image: url('https://raw.githubusercontent.com/interface-daodung/TeyvatCardGameBackend/refs/heads/main/admin-web/public/assets/images/cards/character/nahida.webp'); /* Thay link ảnh của bạn vào đây */
            background-size: cover;
            background-position: center;
            box-shadow: 0 0 20px rgba(0,0,0,0.4);
            transition: transform 0.1s ease-out, box-shadow 0.1s ease-out;
            overflow: hidden;
            cursor: pointer;
        }

        /* Lớp Overlay lấp lánh */
        .holo-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0.5;
            transition: opacity 0.4s ease;
            mix-blend-mode: color-dodge; /* Tạo độ trong suốt và bắt sáng cực mạnh */
            
            /* Kết hợp Gradient cầu vồng và Hạt lấp lánh (Sparkles) */
            background-image: 
                var(--holo-gradient),
                radial-gradient(circle at 50% 50%, white 0.5%, transparent 2%),
                radial-gradient(circle at 20% 30%, white 0.5%, transparent 2%),
                radial-gradient(circle at 80% 70%, white 0.5%, transparent 2%);
            
            background-size: 200% 200%, 100px 100px, 130px 130px, 150px 150px;
            background-repeat: repeat;
        }

        /* Lớp tạo độ bóng loáng (Glisten) */
        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 40%, rgba(255,255,255,0.3) 50%, transparent 60%);
            background-size: 200% 200%;
            background-position: 200% 0;
            z-index: 3;
            transition: opacity 0.4s;
            opacity: 0;
        }

        .card:hover .holo-overlay,
        .card:hover::after {
            opacity: 1;
        }

        .card:hover {
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card" id="card">
        <div class="holo-overlay" id="holo"></div>
    </div>
</div>

<script>
    const card = document.getElementById('card');
    const holo = document.getElementById('holo');

    card.addEventListener('mousemove', (e) => {
        const { offsetWidth: width, offsetHeight: height } = card;
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        // Tính toán góc nghiêng 3D
        const rotateX = ((y / height) - 0.5) * -30; // Nghiêng lên xuống
        const rotateY = ((x / width) - 0.5) * 30;   // Nghiêng trái phải

        // Cập nhật style cho thẻ
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

        // Di chuyển vị trí lấp lánh dựa theo chuột
        // Nhân thêm các hệ số khác nhau để tạo độ "loạn" cho các hạt sparkles
        const xPct = (x / width) * 100;
        const yPct = (y / height) * 100;
        
        holo.style.backgroundPosition = `
            ${xPct}% ${yPct}%, 
            ${xPct * 2}% ${yPct * 2}%, 
            ${xPct * 1.5}% ${yPct * 1.5}%, 
            ${xPct * 3}% ${yPct * 3}%
        `;
        
        // Di chuyển vệt bóng loáng
        card.style.setProperty('--pos-x', `${xPct}%`);
        card.style.setProperty('--pos-y', `${yPct}%`);
    });

    // Reset thẻ khi chuột rời đi
    card.addEventListener('mouseleave', () => {
        card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        holo.style.transition = "opacity 0.5s, background-position 0.5s";
    });

    card.addEventListener('mouseenter', () => {
        holo.style.transition = "opacity 0.4s"; // Bỏ transition vị trí để mượt khi di chuột
    });
</script>

</body>
</html>
