<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Holo Card + Glow Border</title>

<style>
body{
  margin:0;
  background:#101014;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}
</style>
</head>

<body>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<script>

const CARD_W = 420/2;
const CARD_H = 720/2;

class HoloPipeline extends Phaser.Renderer.WebGL.Pipelines.SinglePipeline {

constructor(game){
super({
game,
renderer: game.renderer,

fragShader: `

precision mediump float;

uniform sampler2D uMainSampler;
uniform float uTime;

varying vec2 outTexCoord;

float rand(vec2 co){
return fract(sin(dot(co,vec2(12.9898,78.233)))*43758.5453);
}

vec3 rainbow(float t){
return vec3(
sin(t)*0.5+0.5,
sin(t+2.094)*0.5+0.5,
sin(t+4.188)*0.5+0.5
);
}

float edgeMask(vec2 uv){
vec2 d = min(uv,1.0-uv);
return smoothstep(0.0,0.01,min(d.x,d.y));
}

void main(){

vec2 uv = outTexCoord;

vec4 base = texture2D(uMainSampler,uv);

float mask = edgeMask(uv);

/* holographic sparkle */

vec2 huv = uv + rand(uv+uTime)*0.01;

vec3 spectrum = rainbow(uTime + huv.x*10.0 + huv.y*4.0);

float sparkle = step(0.997, rand(huv*500.0 + uTime));

float spec = pow(1.0-length(uv-0.5),5.0);

vec3 holo = spectrum*spec*0.9 + sparkle*1.2;

vec3 color = base.rgb + holo*base.a;

float alpha = base.a*mask;

gl_FragColor = vec4(color*alpha,alpha);

}
`
});
}
}

class SceneMain extends Phaser.Scene {

preload(){

this.load.image(
'card',
'https://raw.githubusercontent.com/interface-daodung/TeyvatCardGameBackend/refs/heads/main/admin-web/public/assets/images/cards/character/nahida.webp'
);

}

create(){

const W=this.scale.width;
const H=this.scale.height;

this.renderer.pipelines.add('Holo', new HoloPipeline(this.game));


/* ===== glow texture ===== */

const g = this.add.graphics();

g.fillStyle(0xffffff);

g.fillCircle(256,256,256);

g.generateTexture('glow',512,512);

g.destroy();


/* ===== container ===== */

const container = this.add.container(W/2,H/2);


/* glow border */

const glow = this.add.image(0,0,'glow');

glow.setBlendMode(Phaser.BlendModes.ADD);

glow.setScale(0.7);

glow.setAlpha(0.35);


/* card */

const card = this.add.image(0,0,'card');

card.setDisplaySize(CARD_W,CARD_H);

card.setPipeline('Holo');


container.add(glow);
container.add(card);

this.glow = glow;

}

update(time){

const p=this.renderer.pipelines.get('Holo');

p.set1f('uTime',time*0.002);


/* glow breathing animation */

this.glow.scale = 0.68 + Math.sin(time*0.002)*0.03;
this.glow.alpha = 0.32 + Math.sin(time*0.003)*0.05;

}

}

new Phaser.Game({

type: Phaser.WEBGL,

width: window.innerWidth,
height: window.innerHeight,

backgroundColor:"#101014",

scene:[SceneMain]

});

</script>
</body>
</html>
