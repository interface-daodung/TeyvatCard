<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Card + Holo Shader + Glow</title>

<style>
body{
  margin:0;
  background:#101014;
  height:100vh;
  display:flex;
  flex-direction:column;
}
#controls{
  padding:8px 12px;
  display:flex;
  gap:8px;
}
#game-root{
  flex:1;
  display:flex;
  justify-content:center;
  align-items:center;
}
button{
  padding:4px 10px;
  background:#232338;
  color:#eee;
  border:1px solid #555;
  border-radius:4px;
  cursor:pointer;
}
button:hover{
  background:#35355a;
}
</style>
</head>

<body>

<div id="controls">
  <button id="toggleGlow">Toggle Glow</button>
  <button id="toggleCard">Toggle Card</button>
  <button id="glowRainbow">Glow Rainbow</button>
  <button id="glowBlue">Glow Blue</button>
  <button id="glowGold">Glow Gold</button>
  <button id="borderBlue">Border Blue</button>
  <button id="borderGold">Border Gold</button>
</div>

<div id="game-root"></div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>

<script>

const CARD_W = 210;
const CARD_H = 360;
const PADDING = 80;

/* =========================
   HOLOGRAPHIC CARD SHADER
   ========================= */

class HoloPipeline extends Phaser.Renderer.WebGL.Pipelines.SinglePipeline{
  constructor(game){
    super({
      game,
      renderer:game.renderer,
      fragShader:`

precision mediump float;

uniform sampler2D uMainSampler;
uniform float uTime;
uniform float uSweep;

varying vec2 outTexCoord;

float rand(vec2 co){
  return fract(sin(dot(co,vec2(12.9898,78.233))) * 43758.5453);
}

vec3 rainbow(float t){
  return vec3(
    sin(t)*0.5+0.5,
    sin(t+2.094)*0.5+0.5,
    sin(t+4.188)*0.5+0.5
  );
}

float edgeMask(vec2 uv){
  vec2 d=min(uv,1.0-uv);
  return smoothstep(0.0,0.01,min(d.x,d.y));
}

float strip(float d,float c,float w){
  return smoothstep(c-w,c,d)-smoothstep(c,c+w,d);
}

void main(){
  vec2 uv=outTexCoord;
  vec4 base=texture2D(uMainSampler,uv);

  float mask=edgeMask(uv);

  // foil diffraction
  float foilAngle = dot(uv-0.5, vec2(1.2,0.7));
  vec3 foilColor = rainbow(foilAngle*6.0 + uTime*0.5) * 0.25;

  // sweep
  float diag = dot(uv, vec2(1.0,1.0));

  float s1 = strip(diag,uSweep,0.2);
  float s2 = strip(diag,uSweep-0.15,0.05);
  float s3 = strip(diag,uSweep-0.30,0.01);

  float core = s1+s2+s3;

  // glow
  float g1 = strip(diag,uSweep,0.05);
  float g2 = strip(diag,uSweep-0.15,0.05);
  float g3 = strip(diag,uSweep-0.30,0.05);

  float glowWide = strip(diag,uSweep,0.12);

  float glow = g1+g2+g3 + glowWide*0.6;

  // rainbow specular
  vec3 specColor = rainbow(diag*8.0 + uTime*1.5);

  vec3 specular =
      specColor * core * 0.9 +
      specColor * glow * 0.35;

  // sparkle trail
  float sparkle = 0.0;

  for(int i=0;i<6;i++){
    vec2 p = uv + vec2(float(i)*0.02);
    float d = abs(dot(p,vec2(1.0,1.0)) - (uSweep-0.35));
    float s = step(0.997, rand(p*600.0 + uTime));
    sparkle += s * smoothstep(0.2,0.0,d);
  }

  sparkle *= 0.9;
  vec3 sparkleColor = vec3(1.0)*sparkle;

  // final
  vec3 color = base.rgb;
  color += foilColor;
  color += specular;
  color += sparkleColor;

  float alpha = base.a * mask;
  gl_FragColor = vec4(color*alpha,alpha);
}
`
    });
  }
}

/* =========================
   GLOW BORDER SHADER (match demo 4)
   ========================= */

class GlowPipeline extends Phaser.Renderer.WebGL.Pipelines.SinglePipeline{
  constructor(game){
    super({
      game,
      renderer:game.renderer,
      fragShader:`

precision mediump float;

uniform sampler2D uMainSampler;
uniform float uTime;
uniform vec3 uColor;       // solid color
uniform float uUseRainbow; // 1.0 = rainbow, 0.0 = solid

varying vec2 outTexCoord;

vec3 rainbow(float t){
  return vec3(
    sin(t)*0.5+0.5,
    sin(t+2.094)*0.5+0.5,
    sin(t+4.188)*0.5+0.5
  );
}

float sdRoundRect(vec2 p, vec2 b, float r){
  vec2 d = abs(p) - b + vec2(r);
  return min(max(d.x,d.y),0.0) + length(max(d,0.0)) - r;
}

void main(){
  vec2 uv = outTexCoord;
  vec2 p = uv - 0.5;

  // use pure SDF rounded-rect as glow mask
  // keep same height, adjust width so height/width ~= 12/7
  // CARD_H / CARD_W = 360 / 210 = 12 / 7
  // vec2 b = vec2(0.61 * 7.0 / 12.0, 0.37);
  // vec2 b = vec2(0.26, 0.28);
  vec2 b = vec2(0.29,0.3);
  float radius = 0.0001;

  float dist = sdRoundRect(p,b,radius);

  // SDF-based glow band
  float glowMask = smoothstep(0.2, 0.0, dist);

  vec3 glowColor;
  if(uUseRainbow > 0.5){
    glowColor = rainbow(uTime*1.5 - dist*3.0);
  }else{
    glowColor = uColor;
  }

  vec3 finalColor = glowColor * glowMask;
  float finalAlpha = glowMask;

  gl_FragColor = vec4(finalColor, finalAlpha);
}
`
    });
  }
}

class SceneMain extends Phaser.Scene{
  preload(){
    this.load.image(
      'card',
      'https://raw.githubusercontent.com/interface-daodung/TeyvatCardGameBackend/refs/heads/main/admin-web/public/assets/images/cards/character/nahida.webp'
    );
  }

  create(){
    const W=this.scale.width;
    const H=this.scale.height;

    this.renderer.pipelines.add('Holo', new HoloPipeline(this.game));
    this.renderer.pipelines.add('Glow', new GlowPipeline(this.game));

    // default glow mode: rainbow
    const glowPipe = this.renderer.pipelines.get('Glow');
    glowPipe.set3f('uColor', 0.2, 0.8, 1.0);
    glowPipe.set1f('uUseRainbow', 1.0);

    // ROOT
    this.root = this.add.container(W/2,H/2);

    // GLOW CONTAINER (RenderTexture + Glow shader, same logic as demo 4)
    this.glowContainer = this.add.container(0,0);

    const rtW = CARD_W + PADDING;
    const rtH = CARD_H + PADDING;

    const glowRT = this.add.renderTexture(0,0,rtW,rtH);

    const frame = this.textures.getFrame('card');
    const scaleX = CARD_W / frame.width;
    const scaleY = CARD_H / frame.height;

    const tempImage = this.make.image({key:'card'}, false);
    tempImage.setScale(scaleX, scaleY);

    glowRT.draw(tempImage, rtW/2, rtH/2);
    tempImage.destroy();

    glowRT.setPipeline('Glow');

    this.glowContainer.add(glowRT);

    // CARD CONTAINER (border + image + Holo shader + hover)
    this.cardContainer = this.add.container(0,0);

    // simple rounded border following card rect (no shader)
    const borderPadding = 2;
    const borderRadius = 20;
    const borderWidth = CARD_W + borderPadding;
    const borderHeight = CARD_H + borderPadding;

    const cardBorder = this.add.graphics();
    cardBorder.lineStyle(1, 0x22ccff, 1);
    cardBorder.strokeRoundedRect(
      -borderWidth/2,
      -borderHeight/2,
      borderWidth,
      borderHeight,
      borderRadius
    );

    this.card = this.add.image(0,0,'card');
    this.card.setDisplaySize(CARD_W,CARD_H);
    this.card.setPipeline('Holo');
    this.card.setInteractive();
    // cardBorder.setDepth(10);
    // this.card.setDepth(5);
    // add border under card
    this.cardContainer.add(this.card);
    this.cardContainer.add(cardBorder);

    // keep references for runtime color change
    this.cardBorder = cardBorder;
    this.cardBorderConfig = {
      padding:borderPadding,
      radius:borderRadius,
      lineWidth:8
    };

    // add order
    this.root.add(this.glowContainer);
    this.root.add(this.cardContainer);

    // hover logic
    this.sweep=-1.5;
    this.isHover=false;

    this.card.on('pointerover',()=>{
      if(!this.isHover){
        this.isHover=true;
        this.sweep=-1.2;
      }
    });

    // expose for debugging
    window.__scene = this;
  }

  update(time){
    const holo=this.renderer.pipelines.get('Holo');
    const glow=this.renderer.pipelines.get('Glow');

    if(holo){
      holo.set1f('uTime',time*0.002);
      holo.set1f('uSweep',this.sweep);
    }

    if(glow){
      glow.set1f('uTime',time*0.001);
    }

    if(this.sweep>-2){
      this.sweep+=0.12;

      if(this.sweep>2.0){
        this.sweep=-2;
        this.isHover=false;
      }
    }
  }
}

new Phaser.Game({
  type:Phaser.WEBGL,
  width:window.innerWidth,
  height:window.innerHeight - 40,
  backgroundColor:"#101014",
  scene:[SceneMain],
  parent:'game-root'
});

</script>

<script>
// helpers
function getGlowPipeline(){
  if(!window.__scene) return null;
  return window.__scene.renderer.pipelines.get('Glow');
}

function setGlowColor(r,g,b){
  const glow = getGlowPipeline();
  if(!glow) return;
  glow.set3f('uColor', r, g, b);
  glow.set1f('uUseRainbow', 0.0);
}

function setGlowRainbow(){
  const glow = getGlowPipeline();
  if(!glow) return;
  glow.set1f('uUseRainbow', 1.0);
}

function setBorderColor(r,g,b){
  if(!window.__scene || !window.__scene.cardBorder) return;

  const scene = window.__scene;
  const color =
    ((r*255)&0xff)<<16 |
    ((g*255)&0xff)<<8  |
    ((b*255)&0xff);

  const padding = scene.cardBorderConfig.padding;
  const radius  = scene.cardBorderConfig.radius;
  const lineW   = scene.cardBorderConfig.lineWidth;

  const borderWidth  = CARD_W + padding;
  const borderHeight = CARD_H + padding;

  scene.cardBorder.clear();
  scene.cardBorder.lineStyle(lineW, color, 1);
  scene.cardBorder.strokeRoundedRect(
    -borderWidth/2,
    -borderHeight/2,
    borderWidth,
    borderHeight,
    radius
  );
}

// simple debug buttons to toggle visibility
document.getElementById('toggleGlow').addEventListener('click',()=>{
  if(window.__scene && window.__scene.glowContainer){
    window.__scene.glowContainer.visible = !window.__scene.glowContainer.visible;
  }
});

document.getElementById('toggleCard').addEventListener('click',()=>{
  if(window.__scene && window.__scene.cardContainer){
    window.__scene.cardContainer.visible = !window.__scene.cardContainer.visible;
  }
});

// color test buttons
document.getElementById('glowRainbow').addEventListener('click',()=>{
  setGlowRainbow();
});

document.getElementById('glowBlue').addEventListener('click',()=>{
  setGlowColor(0.2, 0.8, 1.0);
});

document.getElementById('glowGold').addEventListener('click',()=>{
  setGlowColor(1.0, 0.8, 0.2);
});

// border color test buttons
document.getElementById('borderBlue').addEventListener('click',()=>{
  setBorderColor(0.2, 0.8, 1.0);
});

document.getElementById('borderGold').addEventListener('click',()=>{
  setBorderColor(1.0, 0.8, 0.2);
});
</script>

</body>
</html>
