<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Holographic Card Fix</title>
    <style>
        :root {
            /* Gradient cầu vồng mượt mà */
            --holo-gradient: linear-gradient(125deg, 
                rgba(255,0,132,0.3) 15%, 
                rgba(252,255,0,0.3) 30%, 
                rgba(0,255,138,0.3) 45%, 
                rgba(0,209,255,0.3) 60%, 
                rgba(122,0,255,0.3) 85%);
            
            /* Texture ngôi sao lấp lánh (Link dự phòng ổn định) */
            --star-texture: url('https://raw.githubusercontent.com/simeydotme/pokemon-cards-css/main/public/img/mask-stars.png');
        }

        body {
            background: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        .card-container {
            perspective: 1000px;
        }

        .card {
            width: 320px;
            height: 446px;
            border-radius: 15px;
            position: relative;
            /* Thay link ảnh mới ở đây - Ảnh Charizard cực ngầu */
            background-image: url('https://images.pokemontcg.io/base1/4_hires.png');
            background-size: 100% 100%;
            background-position: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.1s ease-out;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .holo-overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            opacity: 0;
            transition: opacity 0.4s ease;
            mix-blend-mode: color-dodge;
            
            /* Lớp 1: Cầu vồng | Lớp 2: Ngôi sao */
            background-image: var(--holo-gradient), var(--star-texture);
            background-size: 200% 200%, 250px 250px;
            background-repeat: repeat;
            filter: brightness(1.2) contrast(1.2);
        }

        /* Hiệu ứng tia sáng quét ngang khi hover */
        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(115deg, 
                transparent 40%, 
                rgba(255,255,255,0.5) 50%, 
                transparent 60%);
            background-size: 200% 200%;
            background-position: 200% 0;
            z-index: 3;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .card:hover .holo-overlay,
        .card:hover::before {
            opacity: 1;
        }

        .card:hover::before {
            background-position: -200% 0;
            transition: background-position 0.8s ease-in-out, opacity 0.3s;
        }
    </style>
</head>
<body>

<div class="card-container">
    <div class="card" id="card">
        <div class="holo-overlay" id="holo"></div>
    </div>
</div>

<script>
    const card = document.getElementById('card');
    const holo = document.getElementById('holo');

    card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const xPct = (x / rect.width) * 100;
        const yPct = (y / rect.height) * 100;

        // Nghiêng thẻ
        const rotateX = (0.5 - (y / rect.height)) * 30;
        const rotateY = ((x / rect.width) - 0.5) * 30;
        card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

        // Di chuyển lấp lánh
        // Ngôi sao (lớp thứ 2) di chuyển nhanh hơn cầu vồng (lớp 1)
        holo.style.backgroundPosition = `${xPct}% ${yPct}%, ${xPct * 1.5}% ${yPct * 1.5}%`;
    });

    card.addEventListener('mouseleave', () => {
        card.style.transform = `rotateX(0deg) rotateY(0deg)`;
        holo.style.opacity = 0;
    });
</script>

</body>
</html>
